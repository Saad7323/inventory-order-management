<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:bold}.heading{font-size:19px;font-weight:bold}.label{font-size:14px}.small{font-size:12px}.box{fill:#fff;stroke:#74829a;stroke-width:2}.shade{fill:#edf2f8;stroke:#74829a;stroke-width:1}.button{fill:#2156a5}.buttonText{fill:#fff;font-size:13px;font-weight:bold}</style>
  <rect width="1200" height="820" fill="#f6f8fb"/><rect x="40" y="35" width="1120" height="740" rx="12" class="box"/>
  <text x="80" y="90" class="title">Inventory &amp; Orders</text><text x="80" y="120" class="label">Dashboard | All orders</text>
  <text x="80" y="175" class="heading">Current inventory</text><rect x="80" y="190" width="270" height="42" class="box"/><text x="92" y="216" class="small">Find a product: SKU or name</text><rect x="365" y="190" width="90" height="42" rx="4" class="button"/><text x="386" y="216" class="buttonText">Search</text>
  <rect x="80" y="250" width="1040" height="40" class="shade"/><text x="95" y="275" class="label">SKU</text><text x="210" y="275" class="label">Product</text><text x="440" y="275" class="label">Price</text><text x="540" y="275" class="label">In stock</text><text x="660" y="275" class="label">Status</text><text x="790" y="275" class="label">Restock</text><text x="970" y="275" class="label">Manage</text>
  <rect x="80" y="290" width="1040" height="105" class="box"/><text x="95" y="325" class="label">KB-100</text><text x="210" y="325" class="label">Wireless Keyboard</text><text x="440" y="325" class="label">$49.99</text><text x="555" y="325" class="label">15</text><text x="660" y="325" class="label">Available</text><rect x="790" y="302" width="55" height="32" class="box"/><text x="810" y="324" class="small">1</text><rect x="852" y="302" width="72" height="32" class="button"/><text x="861" y="323" class="buttonText">Restock</text><text x="970" y="325" class="label">Edit | Deactivate</text><text x="95" y="368" class="label">HD-300</text><text x="210" y="368" class="label">USB-C Hub</text><text x="440" y="368" class="label">$39.99</text><text x="555" y="368" class="label">3</text><text x="660" y="368" class="label">Low stock</text>
  <text x="80" y="450" class="heading">Create order</text><rect x="80" y="468" width="420" height="42" class="box"/><text x="92" y="494" class="small">Customer name</text><rect x="80" y="525" width="260" height="42" class="box"/><text x="92" y="551" class="small">Select product</text><rect x="355" y="525" width="80" height="42" class="box"/><text x="370" y="551" class="small">Qty</text><rect x="80" y="582" width="140" height="40" rx="4" class="button"/><text x="93" y="607" class="buttonText">Add another product</text><rect x="235" y="582" width="135" height="40" rx="4" class="button"/><text x="255" y="607" class="buttonText">Confirm order</text>
  <text x="620" y="450" class="heading">Add product</text><rect x="620" y="468" width="400" height="42" class="box"/><text x="633" y="494" class="small">SKU</text><rect x="620" y="525" width="400" height="42" class="box"/><text x="633" y="551" class="small">Product name, price, opening stock, reorder level</text><rect x="620" y="582" width="110" height="40" rx="4" class="button"/><text x="642" y="607" class="buttonText">Add product</text>
  <text x="80" y="700" class="small">Wireframe: dashboard and main operational controls (not a live screenshot).</text>
</svg>
